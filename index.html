<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NASA 오늘의 천체/소행성 사진 조회</title>
  <style>
    :root {
      --bg-color: #0b0d17;
      --card-bg: #151932;
      --accent-color: #00d2ff;
      --text-color: #ffffff;
      --text-muted: #a0a5c0;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin-bottom: 8px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    p.description {
      color: var(--text-muted);
      margin-bottom: 25px;
      font-size: 0.95rem;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      background-color: var(--card-bg);
      padding: 12px 20px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    input[type="date"] {
      background-color: #1e2442;
      border: 1px solid #2e355c;
      color: var(--text-color);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    button {
      background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.98);
    }

    #loading {
      display: none;
      margin: 20px 0;
      color: var(--accent-color);
      font-size: 1.1rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
    }

    .card {
      background-color: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #232946;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .media-container {
      width: 100%;
      max-height: 500px;
      overflow: hidden;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .media-container img {
      width: 100%;
      height: auto;
      object-fit: contain;
      display: block;
    }

    .media-container iframe {
      width: 100%;
      height: 450px;
      border: none;
    }

    .card-content {
      padding: 25px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-color);
      margin: 0;
    }

    .copyright {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .explanation {
      line-height: 1.6;
      color: #d1d5db;
      font-size: 1rem;
      word-break: keep-all;
    }

    .actions {
      margin-top: 20px;
      display: flex;
      gap: 10px;
    }

    .btn-link {
      display: inline-block;
      padding: 8px 16px;
      background-color: #1e2442;
      color: var(--accent-color);
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.85rem;
      border: 1px solid #2e355c;
      transition: background-color 0.2s;
    }

    .btn-link:hover {
      background-color: #2b335c;
    }

    .no-data {
      color: var(--text-muted);
      text-align: center;
      padding: 40px;
    }
  </style>
</head>
<body>

  <h1>🌌 NASA 우주 사진 (APOD) 조회</h1>
  <p class="description">날짜를 선택하여 해당 날짜의 우주 및 천체 사진과 설명을 확인하세요.</p>

  <div class="search-box">
    <input type="date" id="search-date">
    <button onclick="fetchApod()">조회하기</button>
  </div>

  <div id="loading">NASA에서 이미지 및 정보 불러오는 중... 🚀</div>

  <div class="container" id="content-container">
    <!-- 천체 사진 카드가 여기에 표시됩니다. -->
  </div>

  <script>
    const API_KEY = 'nqigncRhhOf9Mdci1ZmU78k11IzTV7yN9YpNm7w2';

    const dateInput = document.getElementById('search-date');
    const today = new Date().toISOString().split('T')[0];
    dateInput.value = today;

    async function fetchApod() {
      const selectedDate = dateInput.value;
      if (!selectedDate) {
        alert('날짜를 선택해 주세요.');
        return;
      }

      const container = document.getElementById('content-container');
      const loading = document.getElementById('loading');

      container.innerHTML = '';
      loading.style.display = 'block';

      // APOD (Astronomy Picture of the Day) API 호출
      const url = `https://api.nasa.gov/planetary/apod?date=${selectedDate}&api_key=${API_KEY}`;

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`오류 발생: ${response.status}`);
        }
        
        const data = await response.json();
        loading.style.display = 'none';

        // 미디어 타입에 따른 처리 (이미지 또는 동영상)
        let mediaHtml = '';
        if (data.media_type === 'image') {
          mediaHtml = `<img src="${data.url}" alt="${data.alt || data.title}">`;
        } else if (data.media_type === 'video') {
          mediaHtml = `<iframe src="${data.url}" allowfullscreen></iframe>`;
        }

        const copyrightText = data.copyright ? `ⓒ ${data.copyright.trim()}` : '';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="media-container">
            ${mediaHtml}
          </div>
          <div class="card-content">
            <div class="card-header">
              <h2 class="card-title">${data.title}</h2>
            </div>
            ${copyrightText ? `<div class="copyright">${copyrightText}</div>` : ''}
            <p class="explanation" style="margin-top: 15px;">${data.explanation}</p>
            <div class="actions">
              ${data.hdurl ? `<a href="${data.hdurl}" target="_blank" class="btn-link">고화질 원본 보기</a>` : ''}
            </div>
          </div>
        `;
        container.appendChild(card);

      } catch (error) {
        loading.style.display = 'none';
        container.innerHTML = `<div class="no-data">데이터를 불러오는 중 오류가 발생했습니다: ${error.message}</div>`;
      }
    }

    // 페이지 로드 시 오늘 날짜 데이터 불러오기
    fetchApod();
  </script>
</body>
</html>
